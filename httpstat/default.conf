# Local stand-in for http://httpstat.us (unreachable), used by the gateway header-routing routes.
server {
  listen 80;
  default_type text/plain;

  location = /200 { return 200 "200 OK"; }
  location = /418 { return 418 "418 I'm a teapot"; }
  location = /501 { return 501 "501 Not Implemented"; }
}
